<div style="margin:0;padding:0;background:#fafafa;font-family:Inter,Arial,sans-serif;color:#121212;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#fafafa;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border-collapse:collapse;background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:30px;">
              <table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:0 0 28px;">
                <tr>
                  <td style="width:38px;height:38px;border-radius:8px;background:#c5050c;color:#ffffff;text-align:center;font-size:18px;font-weight:900;line-height:38px;">
                    BC
                  </td>
                  <td style="padding-left:10px;color:#111111;font-size:20px;font-weight:900;">
                    BuckyChat
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 14px;color:#121212;font-size:30px;line-height:1.1;font-weight:600;">
                Reset your password
              </h1>
              <p style="margin:0 0 26px;color:#5f5f5f;font-size:17px;line-height:1.55;font-weight:600;">
                Use this link to choose a new password for your wisc.edu BuckyChat account.
              </p>
              <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;min-width:170px;padding:16px 22px;border-radius:8px;background:#c5050c;color:#ffffff;font-size:17px;font-weight:800;text-align:center;text-decoration:none;">
                Reset password
              </a>
              <p style="margin:28px 0 0;color:#757575;font-size:14px;line-height:1.5;font-weight:600;">
                If you did not request this password reset, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>

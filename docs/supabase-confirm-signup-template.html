<div style="margin:0;padding:0;background:#f5f7fb;font-family:Inter,Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#f5f7fb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border-collapse:collapse;background:#ffffff;border:1px solid #d7dde8;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 8px;color:#0f766e;font-size:12px;font-weight:800;text-transform:uppercase;">
                BuckyChat
              </p>
              <h1 style="margin:0 0 12px;color:#111827;font-size:28px;line-height:1.15;font-weight:800;">
                Confirm your account
              </h1>
              <p style="margin:0 0 24px;color:#4b5563;font-size:16px;line-height:1.5;">
                Verify your wisc.edu email.
              </p>
              <a href="{{ .SiteURL }}/confirm-signup?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:14px 20px;border-radius:8px;background:#c5050c;color:#ffffff;font-size:16px;font-weight:800;text-decoration:none;">
                Confirm account
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>

app = "buckychat-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  SERVER_ADDR = ":8080"
  CLIENT_ORIGIN = "https://buckychat.com"
  TURN_URLS = "stun:stun.l.google.com:19302"
  CLOUDFLARE_TURN_TTL = "86400"
  ALLOW_SELF_MATCH = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

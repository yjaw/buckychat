name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videochat-client
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.HAS_VERCEL_SECRETS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: videochat-client/package-lock.json

      - name: Install dependencies
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Skip deploy
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: echo "Skipping frontend deploy until Vercel secrets are configured."

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videochat-server
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      HAS_FLY_SECRETS: ${{ secrets.FLY_API_TOKEN != '' }}

    steps:
      - name: Checkout
        if: env.HAS_FLY_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Setup Fly.io
        if: env.HAS_FLY_SECRETS == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: env.HAS_FLY_SECRETS == 'true'
        run: flyctl deploy --remote-only

      - name: Skip deploy
        if: env.HAS_FLY_SECRETS != 'true'
        run: echo "Skipping backend deploy until FLY_API_TOKEN is configured."
